name: Shape drift check
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqllocks/shape@v0.9.3
        with:
          shape-version: '0.9.3'
          project: post-4-drift-in-prs
          fail-on: drift
          comment: 'true'
